<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #181825; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
  .toast { background: #2a2a3e; border-radius: 8px; padding: 14px 16px; width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); border: 1px solid #45475a; display: flex; gap: 12px; align-items: flex-start; }
  .icon-wrap { flex-shrink: 0; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #f38ba8; margin-top: 2px; box-shadow: 0 0 8px rgba(243,139,168,0.6); }
  .body { flex: 1; }
  .app { color: #585b70; font-size: 10px; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .app-dot { width: 6px; height: 6px; background: #89b4fa; border-radius: 50%; }
  .title { color: #cdd6f4; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .sub { color: #a6adc8; font-size: 11px; }
  .time { color: #585b70; font-size: 10px; margin-left: auto; flex-shrink: 0; }
</style>
</head>
<body>
<div class="toast">
  <div class="icon-wrap"><div class="dot"></div></div>
  <div class="body">
    <div class="app"><div class="app-dot"></div>Code Meter</div>
    <div class="title">Claude Code — 5-hour limit at 80%</div>
    <div class="sub">Resets in 1 h 12 m</div>
  </div>
  <div class="time">now</div>
</div>
</body>
</html>
